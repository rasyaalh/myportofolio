{% extends 'base.html' %}

{% block meta %}
    <title>{{ name }} Portfolio</title>
{% endblock meta %}

{% block content %}
<main>
    <section class="hero" id="profile">
        <div class="container hero-grid">
            
            <!-- SISI KIRI: Semua Konten Teks -->
            <div class="hero-identity hero-details">
                <p class="hero-kicker">COMPUTER SCIENCE &middot; UNIVERSITAS INDONESIA</p>
                <h1>{{ name }}</h1>
                <p class="bio">{{ bio }}</p>
                
                <!-- NPM & Program (Berdampingan) -->
                <dl class="meta-list" style="display: flex; gap: 2.5rem; margin: 1.5rem 0;">
                    <div class="meta-row">
                        <dt style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted, #8892b0);">NPM</dt>
                        <dd style="font-weight: 600; font-size: 0.95rem; margin-top: 0.25rem;">{{ npm }}</dd>
                    </div>
                    <div class="meta-row">
                        <dt style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted, #8892b0);">PROGRAM</dt>
                        <dd style="font-weight: 600; font-size: 0.95rem; margin-top: 0.25rem;">{{ study_program }}</dd>
                    </div>
                </dl>

                <!-- Tombol Social Links (Pill Buttons) -->
                <div class="social-links" style="display: flex; gap: 0.75rem; margin-top: 1.5rem; flex-wrap: wrap;">
                    <a href="https://github.com/rasyaalh" class="button social-link" target="_blank" style="padding: 0.5rem 1.25rem; background: #ffffff; color: #0d1322; border-radius: 6px; font-weight: 500; text-decoration: none;">GitHub</a>
                    <a href="https://www.linkedin.com/in/rasya-al-hawari-94467637b" class="button social-link" target="_blank" style="padding: 0.5rem 1.25rem; background: #ffffff; color: #0d1322; border-radius: 6px; font-weight: 500; text-decoration: none;">LinkedIn</a>
                    <a href="mailto:rasyaalhawari10@gmail.com" class="button social-link" style="padding: 0.5rem 1.25rem; background: #ffffff; color: #0d1322; border-radius: 6px; font-weight: 500; text-decoration: none;">Email</a>
                </div>
            </div>

            <!-- SISI KANAN: Kartu Foto -->
            <div class="hero-photo">
                <div class="photo-block"></div>
                <img class="avatar" src="/static/img/rasya.jpg" alt="Photo of {{ name }}">
            </div>

        </div>
    </section>
</main>
{% endblock content %}
