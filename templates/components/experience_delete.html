<button type="button" class="button button-danger" popovertarget="delete-experience-{{ experience.id }}">Hapus</button>

<div id="delete-experience-{{ experience.id }}" class="project-delete-modal" popover="auto">
    <div class="project-delete-modal_content">
        <h2>Hapus Pengalaman?</h2>
        <p>Apakah Anda yakin ingin menghapus <strong>{{ experience.title }}</strong>?</p>
        <div class="project-delete-modal_actions">
            <button type="button" class="button button-secondary" popovertarget="delete-experience-{{ experience.id }}" popovertargetaction="hide">Batal</button>
            <form method="post" action="{% url 'main:delete_experience' experience.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </form>
        </div>
    </div>
</div>
