<button type="button" class="button button-danger" popovertarget="delete-certification-{{ cert.id }}">Hapus</button>

<div id="delete-certification-{{ cert.id }}" class="project-delete-modal" popover="auto">
    <div class="project-delete-modal_content">
        <h2>Hapus Sertifikasi?</h2>
        <p>Apakah Anda yakin ingin menghapus <strong>{{ cert.title }}</strong>?</p>
        <div class="project-delete-modal_actions">
            <button type="button" class="button button-secondary" popovertarget="delete-certification-{{ cert.id }}" popovertargetaction="hide">Batal</button>
            <form method="post" action="{% url 'main:delete_certification' cert.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </form>
        </div>
    </div>
</div>
